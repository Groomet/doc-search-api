services:
  postgres:
    image: postgres:17
    container_name: document_finder_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.0

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m

    ports:
      - "127.0.0.1:${ELASTIC_PORT}:9200"

    volumes:
      - elastic_data:/usr/share/elasticsearch/data

    healthcheck:
      test:
        - CMD-SHELL
        - 'curl -fsS http://localhost:9200/_cluster/health >/dev/null'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  init:
    build: .
    restart: "no"

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      ELASTIC_HOST: elasticsearch
      ELASTIC_PORT: 9200

    command: python -m scripts.init_project

    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  app:
    build: .
    container_name: document_finder_api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      ELASTIC_HOST: elasticsearch
      ELASTIC_PORT: 9200

    ports:
      - "127.0.0.1:${API_PORT}:8000"

    depends_on:
      init:
        condition: service_completed_successfully

volumes:
  postgres_data:
  elastic_data: